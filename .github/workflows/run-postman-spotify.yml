name: Run Spotify API tests

on:
  workflow_dispatch:

jobs:
  run-newman-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman collection with Newman
        run: |
          newman run spotify_api_tests.postman_collection.json \
            --environment spotify_api_environment.postman_environment.json \
            --env-var "access_token=${{ secrets.SPOTIFY_ACCESS_TOKEN }}" \
            --env-var "refresh_token=${{ secrets.SPOTIFY_REFRESH_TOKEN }}" \
            --env-var "encoded_client_credentials=${{ secrets.SPOTIFY_ENCODED_CREDENTIALS }}"
