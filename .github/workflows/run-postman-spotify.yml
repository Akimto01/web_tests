name: Run Spotify API tests

on:
  workflow_dispatch:

jobs:
  run-newman-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman collection with Newman
        run: |
          newman run spotify_api_tests.postman_collection.json \
            -e spotify_api_env.postman_environment.json
